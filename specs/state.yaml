decisions:
  - id: ADR-0017
    date: 2026-11-06
    status: accepted
    summary: >
      Battery degradation_cost becomes a policy element with one rule pricing the
      battery's discharge, because HAEO places a rule's price on the source's outbound
      edges for a single source and a wildcard destination. Rejected: charge_limit_cost,
      salvage_value, folding the term into the import price, leaving it unwritten.
  - id: ADR-0016
    date: 2026-11-06
    status: accepted
    summary: >
      A controllable charger is HAEO's deferrable_load (window calendar + power cap),
      not its ev element, which models a vehicle. Charger control stays an adapter
      capability; the profile requires window_calendar. Rejected: ev with invented
      vehicle data, load, buffer, leaving the kind unmapped.
  - id: ADR-0015
    date: 2026-11-05
    status: accepted
    summary: >
      Topology is a per-element connection target field, not a connection subentry; the
      plan synthesises one junction bus per system and the bridge never deletes elements
      it did not create (HAEO owns a switchboard junction of its own). Rejected: connection
      entries, pruning to enforce convergence, guessing ownership from names.
  - id: ADR-0014
    date: 2026-11-06
    status: accepted
    summary: >
      HAEO is provisioned by answering its config/options/subentry flows through a narrow
      port; direct subentry creation and HAEO storage writes are rejected. A form we
      cannot answer stops the apply with a named FlowError instead of guessing. Deletion
      is the only direct subentry call, because no flow exists for it.
  - id: ADR-0013
    date: 2026-11-05
    status: proposed
    summary: >
      grid/solar/battery/load/ev_charger map directly to HAEO element types. A meter is not
      an element; thermostat and relay are control surfaces whose energy is carried by a
      load-type element. Unmapped kinds block the apply rather than picking a near neighbour.
  - id: ADR-0012
    date: 2026-11-05
    summary: >
      The bridge refuses to apply while HAEO names are unverified. Unverified facts are
      represented as None/False plus an explicit issue code, never as a plausible guess.
  - id: ADR-0011
    date: 2026-11-05
    summary: Product renamed from HA-OPENDERMS (domain openderms) to fleetassistant (domain fleetassistant) to match the repo. Resolves OQ-008.
  - id: ADR-0001..ADR-0010
    date: 2026-11-05
    summary: Brief non-negotiables recorded as accepted ADRs.
  - id: no-code-bootstrap
    date: 2026-11-05
    summary: >
      Bootstrap created documentation and file structure only; implementation followed in a
      separate session (superseded by the 2026-11-05 implemented entry above).

