decisions:
  - id: ADR-0013
    date: 2026-11-05
    status: proposed
    summary: >
      grid/solar/battery/load/ev_charger map directly to HAEO element types. A meter is not
      an element; thermostat and relay are control surfaces whose energy is carried by a
      load-type element. Unmapped kinds block the apply rather than picking a near neighbour.
  - id: ADR-0012
    date: 2026-11-05
    summary: >
      The bridge refuses to apply while HAEO names are unverified. Unverified facts are
      represented as None/False plus an explicit issue code, never as a plausible guess.
  - id: ADR-0011
    date: 2026-11-05
    summary: Product renamed from HA-OPENDERMS (domain openderms) to fleetassistant (domain fleetassistant) to match the repo. Resolves OQ-008.
  - id: ADR-0001..ADR-0010
    date: 2026-11-05
    summary: Brief non-negotiables recorded as accepted ADRs.
  - id: no-code-bootstrap
    date: 2026-11-05
    summary: >
      Bootstrap created documentation and file structure only; implementation followed in a
      separate session (superseded by the 2026-11-05 implemented entry above).

