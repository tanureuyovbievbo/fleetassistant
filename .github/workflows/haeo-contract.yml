name: HAEO contract (live)

# The HAEO bridge is only proven against a real HAEO instance with real config
# flows. This workflow is manual: it needs the HAEO version under test, which is
# pinned in custom_components/fleetassistant/const.py.
#
# Until OQ-002 (element type names) and OQ-006 (hub option names) are resolved,
# this workflow is expected to FAIL at the bridge step. That failure is the
# point: it stops an unverified plan from reaching a customer site.

on:
  workflow_dispatch:
    inputs:
      haeo_version:
        description: "HAEO version to test against (must be in SUPPORTED_HAEO_VERSIONS)"
        default: "0.5.0"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start Home Assistant with HAEO
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant==2026.1.1"
          mkdir -p ha-config/custom_components
          git clone --depth 1 --branch "v${{ inputs.haeo_version }}" \
            https://github.com/hass-energy/haeo haeo-src
          cp -r haeo-src/custom_components/haeo ha-config/custom_components/haeo
          cp -r custom_components/fleetassistant ha-config/custom_components/fleetassistant
      - name: Install HAEO requirements (this is the documented ops step)
        run: python -m pip install "highspy>=1.15.1" "numpy>=2.3.2"
      - name: Run contract tests
        run: python -m pytest -q tests/contract/haeo -m live
        env:
          HAEO_VERSION: ${{ inputs.haeo_version }}
