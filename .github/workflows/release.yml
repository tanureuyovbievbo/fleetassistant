name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the zip without publishing a release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before packaging
        run: |
          python -m pip install --upgrade pip ruff pytest pyyaml
          ruff check .
          python tools/check_boundaries.py
          python -m pytest -q
      - name: Build HACS zip (zip_release layout)
        run: |
          cd custom_components/fleetassistant
          zip -r ../../fleetassistant.zip . -x '*/__pycache__/*' '*.pyc'
      - name: Verify archive contents
        run: |
          python - <<'PY'
          import json
          import zipfile

          with zipfile.ZipFile("fleetassistant.zip") as archive:
              names = archive.namelist()
              assert "manifest.json" in names
              assert "config_flow.py" in names
              data = json.loads(archive.read("manifest.json"))
              assert data["requirements"] == []
              print(f"{len(names)} files packed, domain={data['domain']}, version={data['version']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fleetassistant-zip
          path: fleetassistant.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fleetassistant.zip
          generate_release_notes: true
